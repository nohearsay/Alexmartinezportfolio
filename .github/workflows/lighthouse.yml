name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./web/site

      - name: Build
        run: npm run build
        working-directory: ./web/site

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          budgetPath: ./lighthouse-budget.json
        working-directory: ./web/site
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: web/site/.lighthouseci/
          retention-days: 7

  # Performance budget check
  performance-budget:
    runs-on: ubuntu-latest
    needs: lighthouse
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lighthouse Report
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          path: ./lighthouse-report

      - name: Check budgets
        run: |
          echo "Checking performance budgets..."
          # Budgets are enforced in lighthouse-budget.json
          # This step verifies the report exists and parses key metrics
          ls -la ./lighthouse-report/